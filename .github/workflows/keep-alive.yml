name: Keep Render backend alive

on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend root endpoint
        run: |
          curl -sf -o /dev/null -w "Status: %{http_code}\n" https://perplexity-iz6o.onrender.com/ || echo "Ping failed (backend may be cold-starting)"
